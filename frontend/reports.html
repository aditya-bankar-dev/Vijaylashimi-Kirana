<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reports - Kirana Manager</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head>
<body><div class="app"><aside class="sidebar" id="sidebar"></aside><div class="content"><header class="topbar" id="topbar"></header>
<main class="page"><div class="cardx mb-3"><div class="row g-2 align-items-end"><div class="col-md-3"><label class="form-label small mb-1">Report</label><select id="type" class="form-select"></select></div>
<div class="col-md-2" id="perWrap"><label class="form-label small mb-1">Group by</label><select id="period" class="form-select"><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option><option value="annual">Annual</option></select></div>
<div class="col-md-2 dates"><label class="form-label small mb-1">From</label><input type="date" id="from" class="form-control"></div><div class="col-md-2 dates"><label class="form-label small mb-1">To</label><input type="date" id="to" class="form-control"></div>
<div class="col-md-3 text-end"><button class="btn btn-green" id="run"><i class="bi bi-search"></i> Run</button> <button class="btn btn-outline-success" id="xl"><i class="bi bi-file-earmark-excel"></i> Excel</button> <button class="btn btn-outline-danger" id="pdf"><i class="bi bi-file-earmark-pdf"></i> PDF</button></div></div>
<div class="mt-2 small"><span class="text-muted">Quick range:</span> <a href="#" data-r="0">Today</a> | <a href="#" data-r="7">Last 7 days</a> | <a href="#" data-r="month">This month</a> | <a href="#" data-r="year">This year</a></div></div>
<div class="cardx"><h6 id="title" class="mb-3">Select a report and press Run</h6><div class="table-responsive"><table class="table table-sm"><thead id="head"></thead><tbody id="body"></tbody></table></div></div></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script><script src="js/i18n.js"></script><script src="js/layout.js"></script><script src="js/ui.js"></script><script src="js/reports.js"></script></body></html>
