<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>POS Billing - Kirana Manager</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head>
<body><div class="app"><aside class="sidebar" id="sidebar"></aside>
<div class="content"><header class="topbar" id="topbar"></header>
<main class="page"><div class="row g-3">
  <div class="col-xl-7"><div class="cardx">
    <div class="input-group mb-3"><span class="input-group-text"><i class="bi bi-upc-scan"></i></span>
      <input id="search" class="form-control form-control-lg" placeholder="Scan barcode or search product (F2)" autocomplete="off" autofocus></div>
    <div class="row g-2" id="grid"></div></div></div>
  <div class="col-xl-5"><div class="cardx">
    <div class="d-flex gap-2 mb-2"><select id="customer" class="form-select"><option value="">Walk-in customer</option></select>
      <button class="btn btn-outline-danger" id="clear" title="Clear cart"><i class="bi bi-trash"></i></button></div>
    <div class="cart-scroll"><table class="table table-sm align-middle mb-2"><thead><tr><th>Item</th><th style="width:130px">Qty</th><th class="text-end">Amount</th><th></th></tr></thead><tbody id="cart"></tbody></table></div>
    <div class="input-group input-group-sm mb-2"><span class="input-group-text">Discount</span><input id="disc" type="number" min="0" step="0.01" value="0" class="form-control"><select id="discType" class="form-select" style="max-width:70px"><option value="amt">₹</option><option value="pct">%</option></select></div>
    <div class="small d-flex justify-content-between"><span>Subtotal</span><span id="sub">₹0.00</span></div>
    <div class="small d-flex justify-content-between"><span>Discount</span><span id="dsc">₹0.00</span></div>
    <div class="small d-flex justify-content-between text-muted"><span>GST included</span><span id="gst">₹0.00</span></div>
    <div class="d-flex justify-content-between fs-4 fw-bold border-top pt-2 mt-1"><span>Total</span><span id="total" class="text-success">₹0.00</span></div>
    <div class="row g-2 mt-1">
      <div class="col-4"><label class="form-label small mb-0">Cash</label><input id="pcash" type="number" min="0" step="0.01" class="form-control"></div>
      <div class="col-4"><label class="form-label small mb-0">UPI</label><input id="pupi" type="number" min="0" step="0.01" class="form-control"></div>
      <div class="col-4"><label class="form-label small mb-0">Card</label><input id="pcard" type="number" min="0" step="0.01" class="form-control"></div></div>
    <div class="d-flex gap-1 mt-2"><button class="btn btn-sm btn-outline-secondary flex-fill" data-fill="pcash">Cash = total</button><button class="btn btn-sm btn-outline-secondary flex-fill" data-fill="pupi">UPI = total</button><button class="btn btn-sm btn-outline-secondary flex-fill" data-fill="pcard">Card = total</button></div>
    <div class="d-flex justify-content-between mt-2"><span id="pstate" class="small fw-semibold"></span><button class="btn btn-sm btn-link p-0" id="qrBtn">Show UPI QR</button></div>
    <div id="qr" class="text-center mt-2"></div>
    <button class="btn btn-green w-100 btn-lg mt-2" id="pay"><i class="bi bi-check2-circle me-1"></i>Complete payment</button>
  </div></div></div></main></div></div>
<div class="modal fade" id="done" tabindex="-1" data-bs-backdrop="static"><div class="modal-dialog modal-dialog-centered"><div class="modal-content cardx text-center">
  <i class="bi bi-check-circle-fill text-success" style="font-size:3rem"></i><h5 class="mt-2">Payment successful</h5><p id="doneMsg" class="text-muted"></p>
  <div class="d-grid gap-2"><button class="btn btn-green" id="pThermal"><i class="bi bi-printer me-1"></i>Print thermal receipt</button><button class="btn btn-outline-secondary" id="pA4">Open A4 invoice (PDF)</button><button class="btn btn-outline-dark" data-bs-dismiss="modal">New sale</button></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script><script src="js/i18n.js"></script><script src="js/layout.js"></script><script src="js/billing.js"></script></body></html>
