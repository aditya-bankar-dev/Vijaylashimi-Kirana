<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1f3a">
<title>Kirana Manager</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100vh;background:radial-gradient(circle at 50% 35%,#17436a 0,#102d4d 35%,#07172b 100%);color:#fff;display:grid;place-items:center;overflow:hidden}
.splash{width:min(92vw,560px);text-align:center;padding:42px 24px;animation:appear .8s ease both}
.logo-wrap{width:164px;height:164px;margin:0 auto 26px;display:grid;place-items:center;filter:drop-shadow(0 18px 28px rgba(0,0,0,.28));animation:float 2.8s ease-in-out infinite}
.logo-wrap img{width:100%;height:100%}
h1{font-size:clamp(2rem,6vw,3rem);margin:0;font-weight:850;letter-spacing:-1.3px}
.tagline{color:#cbd5e1;font-size:1rem;margin:12px 0 34px}
.loading{width:min(260px,75%);height:5px;background:rgba(255,255,255,.17);border-radius:20px;margin:0 auto 12px;overflow:hidden}
.loading span{display:block;height:100%;width:0;background:#22c55e;border-radius:20px;animation:progress 10s linear forwards}
.note{font-size:.78rem;color:#94a3b8;letter-spacing:1.6px;text-transform:uppercase}
@keyframes progress{to{width:100%}}@keyframes float{50%{transform:translateY(-9px)}}@keyframes appear{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.logo-wrap{animation:none}.loading span{animation:none;width:100%}}
</style>
</head>
<body>
<main class="splash" aria-label="Kirana Manager loading screen">
  <div class="logo-wrap"><img src="assets/vijayalakshmi-logo.png" alt="Kirana Manager logo"></div>
  <h1 id="brand">Kirana Manager</h1>
  <p class="tagline" id="tagline">Smart • Simple • Store Management</p>
  <div class="loading"><span></span></div>
  <div class="note" id="loadingText">Preparing your store...</div>
</main>
<script>
(() => {
  const mr = localStorage.getItem('language') === 'mr';
  if (mr) {
    document.documentElement.lang = 'mr';
    document.getElementById('brand').textContent = 'किराणा व्यवस्थापक';
    document.getElementById('tagline').textContent = 'स्मार्ट • सोपे • दुकान व्यवस्थापन';
    document.getElementById('loadingText').textContent = 'तुमचे दुकान सुरू होत आहे...';
  }
  const go = () => {
    let u = null;
    try { u = JSON.parse(localStorage.getItem('user') || 'null'); } catch (_) {}
    location.replace(!localStorage.getItem('token') || !u ? 'login.html' : u.role === 'cashier' ? 'billing.html' : 'dashboard.html');
  };
  window.setTimeout(go, 10000);
})();
</script>
</body>
</html>
