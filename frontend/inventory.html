<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inventory - Kirana Manager</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head>
<body><div class="app"><aside class="sidebar" id="sidebar"></aside><div class="content"><header class="topbar" id="topbar"></header>
<main class="page"><div class="row g-3 mb-3" id="val"></div><div class="row g-3">
 <div class="col-lg-4"><div class="cardx mb-3"><h6>Stock movement</h6>
  <label class="form-label small mb-1">Product</label><select id="prod" class="form-select mb-2"></select>
  <label class="form-label small mb-1">Type</label><select id="type" class="form-select mb-2"><option value="stock_in">Stock in</option><option value="stock_out">Stock out</option><option value="adjustment">Stock adjustment (set exact stock)</option><option value="damaged">Damaged</option><option value="expired">Expired</option></select>
  <label class="form-label small mb-1" id="qlabel">Quantity</label><input id="qty" type="number" min="0" step="0.001" class="form-control mb-2">
  <label class="form-label small mb-1">Note</label><input id="note" class="form-control mb-3" maxlength="200"><button class="btn btn-green w-100" id="go">Save movement</button></div>
  <div class="cardx"><h6><i class="bi bi-exclamation-triangle text-warning"></i> Low-stock alerts</h6><div id="alerts" class="small"></div></div></div>
 <div class="col-lg-8"><div class="cardx"><div class="d-flex justify-content-between mb-2"><h6 class="m-0">Stock movement history</h6><select id="ftype" class="form-select form-select-sm w-auto"><option value="">All types</option><option value="sale">Sale</option><option value="purchase">Purchase</option><option value="stock_in">Stock in</option><option value="stock_out">Stock out</option><option value="adjustment">Adjustment</option><option value="damaged">Damaged</option><option value="expired">Expired</option></select></div>
  <div class="table-responsive"><table class="table table-sm align-middle"><thead><tr><th>Date</th><th>Product</th><th>Type</th><th class="text-end">Qty</th><th class="text-end">Balance</th><th>Note</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></div></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script><script src="js/i18n.js"></script><script src="js/layout.js"></script><script src="js/ui.js"></script><script src="js/inventory.js"></script></body></html>
