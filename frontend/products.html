<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Products - Kirana Manager</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head>
<body><div class="app"><aside class="sidebar" id="sidebar"></aside><div class="content"><header class="topbar" id="topbar"></header>
<main class="page"><div class="cardx"><div class="row g-2 mb-3 align-items-center">
 <div class="col-md-3"><input id="q" class="form-control" placeholder="Search name, SKU or barcode"></div>
 <div class="col-md-2"><select id="cat" class="form-select"><option value="">All categories</option></select></div>
 <div class="col-auto form-check ms-2"><input type="checkbox" class="form-check-input" id="low"><label class="form-check-label" for="low">Low stock</label></div>
 <div class="col-auto form-check"><input type="checkbox" class="form-check-input" id="exp"><label class="form-check-label" for="exp">Expiring (30d)</label></div>
 <div class="col text-end edit-only"><button class="btn btn-outline-secondary btn-sm" id="imp"><i class="bi bi-upload"></i> Import</button> <button class="btn btn-outline-secondary btn-sm" id="exb"><i class="bi bi-download"></i> Export</button> <button class="btn btn-green btn-sm" id="add"><i class="bi bi-plus-lg"></i> Add product</button><input type="file" id="file" accept=".xlsx" hidden></div></div>
 <div class="table-responsive"><table class="table align-middle"><thead><tr><th>Product</th><th>Barcode</th><th>Category</th><th class="text-end">Price</th><th>GST</th><th>Stock</th><th>Expiry</th><th class="edit-only"></th></tr></thead><tbody id="rows"></tbody></table></div></div></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script><script src="js/i18n.js"></script><script src="js/layout.js"></script><script src="js/ui.js"></script><script src="js/products.js"></script></body></html>
