<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard - Kirana Manager</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head>
<body><div class="app"><aside class="sidebar" id="sidebar"></aside>
<div class="content"><header class="topbar" id="topbar"></header>
<main class="page">
  <div class="row g-3 mb-3" id="stats"></div>
  <div class="row g-3">
    <div class="col-lg-8"><div class="cardx"><div class="d-flex justify-content-between mb-2"><h6 class="m-0">Sales trend</h6>
      <div class="btn-group btn-group-sm" id="range"><button class="btn btn-outline-secondary active" data-r="daily">Daily</button><button class="btn btn-outline-secondary" data-r="weekly">Weekly</button><button class="btn btn-outline-secondary" data-r="monthly">Monthly</button></div></div>
      <canvas id="trend" height="110"></canvas></div></div>
    <div class="col-lg-4"><div class="cardx"><h6>Top-selling products</h6><canvas id="top"></canvas></div></div>
    <div class="col-12"><div class="cardx"><h6>Revenue analysis (monthly)</h6><canvas id="rev" height="70"></canvas></div></div>
  </div></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="js/api.js"></script><script src="js/i18n.js"></script><script src="js/layout.js"></script><script src="js/dashboard.js"></script></body></html>
