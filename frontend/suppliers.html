<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suppliers - Kirana Manager</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head>
<body><div class="app"><aside class="sidebar" id="sidebar"></aside><div class="content"><header class="topbar" id="topbar"></header>
<main class="page"><div class="cardx"><div class="d-flex gap-2 mb-3"><input id="q" class="form-control" placeholder="Search by name or phone"><button class="btn btn-green text-nowrap" id="add"><i class="bi bi-plus-lg"></i> Add supplier</button></div>
<div class="table-responsive"><table class="table align-middle"><thead><tr><th>Supplier</th><th>Contact</th><th>GSTIN</th><th class="text-end">Outstanding</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div>
<div class="modal fade" id="hm"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header"><h6 class="modal-title" id="hname"></h6><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body">
<div class="d-flex justify-content-between align-items-center mb-3"><div><span class="text-muted small">Outstanding balance</span><div class="fs-4 fw-bold text-danger" id="hout"></div></div><button class="btn btn-green" id="payBtn"><i class="bi bi-cash-coin"></i> Record payment</button></div>
<h6>Purchase history</h6><div class="table-responsive mb-3"><table class="table table-sm"><thead><tr><th>PO</th><th>Date</th><th class="text-end">Total</th><th class="text-end">Paid</th><th>Status</th></tr></thead><tbody id="hpur"></tbody></table></div>
<h6>Payment history</h6><div class="table-responsive"><table class="table table-sm"><thead><tr><th>Date</th><th>Method</th><th>Reference</th><th class="text-end">Amount</th></tr></thead><tbody id="hpay"></tbody></table></div></div></div></div></div></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script><script src="js/i18n.js"></script><script src="js/layout.js"></script><script src="js/ui.js"></script><script src="js/suppliers.js"></script></body></html>
