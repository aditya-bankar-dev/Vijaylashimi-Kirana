<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customers - Kirana Manager</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head>
<body><div class="app"><aside class="sidebar" id="sidebar"></aside><div class="content"><header class="topbar" id="topbar"></header>
<main class="page"><div class="cardx"><div class="d-flex gap-2 mb-3"><input id="q" class="form-control" placeholder="Search by name or mobile"><button class="btn btn-green text-nowrap" id="add"><i class="bi bi-person-plus"></i> Add customer</button></div>
 <div class="table-responsive"><table class="table align-middle"><thead><tr><th>Customer</th><th>Mobile</th><th>Loyalty points</th><th>Discount</th><th class="text-end">Total spent</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div>
<div class="modal fade" id="prof"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header"><h6 class="modal-title" id="pname"></h6><button class="btn-close" data-bs-dismiss="modal"></button></div>
 <div class="modal-body"><div class="row g-2 mb-3" id="pstats"></div><h6>Purchase history</h6><div class="table-responsive"><table class="table table-sm"><thead><tr><th>Invoice</th><th>Date</th><th class="text-end">Total</th><th>Status</th><th></th></tr></thead><tbody id="phist"></tbody></table></div></div></div></div></div></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script><script src="js/i18n.js"></script><script src="js/layout.js"></script><script src="js/ui.js"></script><script src="js/customers.js"></script></body></html>
