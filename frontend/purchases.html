<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Purchases - Kirana Manager</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head>
<body><div class="app"><aside class="sidebar" id="sidebar"></aside><div class="content"><header class="topbar" id="topbar"></header>
<main class="page"><div class="cardx"><div class="d-flex flex-wrap gap-2 mb-3"><select id="fs" class="form-select w-auto"><option value="">All status</option><option>draft</option><option>confirmed</option><option>cancelled</option></select>
<select id="fp" class="form-select w-auto"><option value="">All payments</option><option>unpaid</option><option>partial</option><option>paid</option></select><div class="ms-auto"><button class="btn btn-green" id="add"><i class="bi bi-plus-lg"></i> New purchase order</button></div></div>
<div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>PO</th><th>Supplier</th><th>Invoice</th><th>Date</th><th class="text-end">Total</th><th class="text-end">Paid</th><th>Status</th></tr></thead><tbody id="rows" style="cursor:pointer"></tbody></table></div></div>
<div class="modal fade" id="newm"><div class="modal-dialog modal-xl"><div class="modal-content"><div class="modal-header"><h6 class="modal-title">New purchase order</h6><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body">
<div class="row g-2 mb-3"><div class="col-md-4"><label class="form-label small mb-1">Supplier *</label><select id="sup" class="form-select"></select></div><div class="col-md-4"><label class="form-label small mb-1">Supplier invoice no.</label><input id="inv" class="form-control"></div><div class="col-md-4"><label class="form-label small mb-1">Date *</label><input id="pdate" type="date" class="form-control"></div></div>
<div class="table-responsive"><table class="table table-sm align-middle"><thead><tr><th style="min-width:200px">Product</th><th style="width:90px">Qty</th><th style="width:110px">Price (excl. GST)</th><th style="width:80px">GST %</th><th>Batch</th><th>Expiry</th><th class="text-end">Line total</th><th></th></tr></thead><tbody id="lines"></tbody></table></div>
<button class="btn btn-sm btn-outline-secondary" id="addLine"><i class="bi bi-plus"></i> Add item</button>
<div class="row g-2 mt-2 align-items-end"><div class="col-md-3"><label class="form-label small mb-1">Paid now (₹)</label><input id="paid" type="number" min="0" step="0.01" class="form-control"></div><div class="col-md-3"><label class="form-label small mb-1">Method</label><select id="pm" class="form-select"><option>cash</option><option>upi</option><option>card</option><option>bank</option></select></div>
<div class="col-md-6 text-end"><div class="small text-muted">Subtotal <b id="tsub">₹0.00</b> • GST <b id="tgst">₹0.00</b></div><div class="fs-4 fw-bold">Total <span id="ttot" class="text-success">₹0.00</span></div></div></div></div>
<div class="modal-footer"><button class="btn btn-outline-secondary" id="draft">Save as draft</button><button class="btn btn-green" id="conf">Save and confirm (update stock)</button></div></div></div></div>
<div class="modal fade" id="detm"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header"><h6 class="modal-title" id="dt"></h6><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><div id="dinfo" class="small text-muted mb-2"></div>
<table class="table table-sm"><thead><tr><th>Product</th><th class="text-end">Qty</th><th class="text-end">Price</th><th class="text-end">GST</th><th class="text-end">Total</th></tr></thead><tbody id="ditems"></tbody></table><div class="text-end fw-bold" id="dtot"></div></div><div class="modal-footer" id="dact"></div></div></div></div></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script><script src="js/i18n.js"></script><script src="js/layout.js"></script><script src="js/ui.js"></script><script src="js/purchases.js"></script></body></html>
